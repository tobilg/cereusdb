name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  build-scope:
    runs-on: ubuntu-latest
    outputs:
      minimal_only: ${{ steps.scope.outputs.minimal_only }}
      package_matrix: ${{ steps.scope.outputs.package_matrix }}

    steps:
      - name: Determine build scope
        id: scope
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

          if [[ "$BRANCH_NAME" == feature/* ]]; then
            echo "minimal_only=true" >> "$GITHUB_OUTPUT"
            echo 'package_matrix=["minimal"]' >> "$GITHUB_OUTPUT"
          else
            echo "minimal_only=false" >> "$GITHUB_OUTPUT"
            echo 'package_matrix=["minimal","standard","global","full"]' >> "$GITHUB_OUTPUT"
          fi

  build-wasm:
    runs-on: ubuntu-latest
    needs: build-scope
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Load pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' deps/versions.env >> "$GITHUB_ENV"

      - name: Check dependency pins
        run: make check-deps-remote

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Verify toolchain
        run: emcc -v

      - name: Use Emscripten's Binaryen
        run: |
          BINARYEN_ROOT="$(em-config BINARYEN_ROOT)"
          echo "$BINARYEN_ROOT/bin" >> "$GITHUB_PATH"
          "$BINARYEN_ROOT/bin/wasm-opt" --version

      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --locked --version ${{ env.WASM_PACK_VERSION }}

      - name: Build browser packages
        run: |
          if [ "${{ needs.build-scope.outputs.minimal_only }}" = "true" ]; then
            make build-minimal
          else
            make build-minimal
            make build-standard
            make build-global
            make build-full
          fi

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-artifacts
          path: |
            dist/minimal
            dist/standard
            dist/global
            dist/full
          if-no-files-found: error
          retention-days: 7

  packages:
    runs-on: ubuntu-latest
    needs: [build-scope, build-wasm]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.build-scope.outputs.package_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Load pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' deps/versions.env >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-artifacts
          path: dist

      - name: Recreate pkg symlink for selected package
        run: ln -sfn dist/${{ matrix.package }} pkg

      - name: Install JS dependencies
        run: cd js && npm ci

      - name: Build shared TypeScript wrapper
        run: cd js && npm exec tsc

      - name: Run Vitest for ${{ matrix.package }}
        run: cd js && npm run test:${{ matrix.package }}

      - name: Build npm package shell
        run: node scripts/build-npm-package.mjs ${{ matrix.package }}

      - name: Smoke test packed npm package
        run: node scripts/smoke-packed-package.mjs ${{ matrix.package }}
