[workspace]
members = [
    "rust/cereusdb",
    "rust/cereusdb-object-store",
]
exclude = [
    "deps/sedona-db",
    "deps/object-store",
    "build/patched-sources/sedona-db",
    "build/patched-sources/object-store",
    "build/patched-sources/datafusion-common",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
license = "Apache-2.0"
edition = "2021"

[workspace.dependencies]
# Only deps needed by OUR crates (not sedona-db's)
arrow = { version = "57.1.0", features = ["prettyprint", "ffi", "chrono-tz"] }
arrow-array = { version = "57.1.0" }
arrow-ipc = { version = "57.1.0" }
arrow-json = { version = "57.1.0" }
arrow-schema = { version = "57.1.0" }
async-trait = { version = "0.1.87" }
bytes = "1.11"
chrono = { version = "0.4.41", default-features = false }
datafusion = { version = "52.5.0", default-features = false }
datafusion-catalog-listing = { version = "52.5.0" }
datafusion-common = { version = "52.5.0", default-features = false }
datafusion-datasource-parquet = { version = "52.5.0", default-features = false }
datafusion-expr = { version = "52.5.0" }
futures = "0.3"
geo-types = "0.7.17"
geojson = "1.0.0"
http = "1"
http-body-util = "0.1"
log = "^0.4"
object_store = { version = "=0.12.5", default-features = false }
parquet = { version = "57.1.0", default-features = false, features = ["arrow", "snap", "brotli", "flate2-zlib-rs", "lz4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
url = "2.5.7"
wkb = "0.9.2"

[patch.crates-io]
geos-sys = { path = "build/patched-sources/georust-geos/sys" }
geos = { path = "build/patched-sources/georust-geos" }
proj-sys = { path = "build/patched-sources/georust-proj/proj-sys" }
gdal-sys = { path = "build/patched-sources/georust-gdal/gdal-sys" }
object_store = { path = "build/patched-sources/object-store" }
datafusion-common = { path = "build/patched-sources/datafusion-common" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "unwind"
